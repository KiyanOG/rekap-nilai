<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekap Nilai</title>
<style>
:root{
  --bg:#fafafa;--card:#ffffff;--ink:#111113;--mute:#71717a;--line:#e8e8ec;--hover:#f4f4f6;
  --btn:#111113;--btn-ink:#ffffff;--danger:#d13b34;--focus:#4f6bff;--radius:10px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b0b0c;--card:#141416;--ink:#f4f4f5;--mute:#8b8b95;--line:#26262b;--hover:#1c1c20;--btn:#f4f4f5;--btn-ink:#0b0b0c;--danger:#ff7b73;--focus:#7c93ff;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#141416;--ink:#f4f4f5;--mute:#8b8b95;--line:#26262b;--hover:#1c1c20;--btn:#f4f4f5;--btn-ink:#0b0b0c;--danger:#ff7b73;--focus:#7c93ff;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* tombol */
button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--hover)}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:600}
button.primary:hover{opacity:.88}
button.ghost{border-color:transparent;background:transparent;color:var(--mute)}
button.ghost:hover{background:var(--hover);color:var(--ink)}
button.danger{color:var(--danger)}

/* input */
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;transition:border-color .15s}
input:hover,textarea:hover{border-color:var(--mute)}
input:focus,textarea:focus{border-color:var(--focus);outline:none}
::placeholder{color:var(--mute);opacity:.8}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}

/* login */
.auth{max-width:360px;margin:14vh auto 0}
.auth h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.auth .sub{color:var(--mute);margin:0 0 28px}
.auth label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
.auth .err{min-height:22px;margin:10px 0 4px;color:var(--danger);font-size:14px}
.auth .full{width:100%;padding:11px}
.auth .alt{text-align:center;margin:20px 0 0;color:var(--mute);font-size:14px}
.auth .alt a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.auth .note{color:var(--mute);font-size:12.5px;margin-top:28px;line-height:1.6}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.top h1{font-size:20px;letter-spacing:-.01em;margin:0}
.top .who{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}

/* layout */
.layout{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
@media(max-width:780px){.layout{grid-template-columns:1fr;gap:20px}}
.side h2,.main h2{font-size:12.5px;font-weight:600;color:var(--mute);margin:0 0 10px;letter-spacing:.01em}
.add{display:flex;gap:6px;margin-bottom:12px}
.add button{flex:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--mute)}
.list li:hover{background:var(--hover);color:var(--ink)}
.list li.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.list li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li button{padding:2px 6px;font-size:13px}
.list .none{cursor:default;background:none}

/* main */
.title{font-size:26px;letter-spacing:-.02em;font-weight:700;margin:0 0 18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tools .col{display:flex;gap:6px;flex:1;min-width:220px}
.tools .col button{flex:none;white-space:nowrap}
.tools .col input{min-width:0}
.tablebox{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:520px}
th{padding:11px 12px;text-align:left;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;border-bottom:1px solid var(--line)}
th button{padding:0 0 0 6px;border:0;background:none;color:var(--mute);font-size:12px}
th button:hover{background:none;color:var(--danger)}
td{padding:0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.no{padding:0 12px;width:44px;color:var(--mute);font-size:13px}
td input{border:0;border-radius:0;background:transparent;padding:11px 12px;min-width:96px}
td input:hover{background:var(--hover)}
td input:focus{background:var(--hover);box-shadow:inset 0 -2px 0 var(--focus)}
td.del{width:44px;text-align:center}
td.del button{border:0;background:none;color:var(--mute);padding:6px 10px}
td.del button:hover{color:var(--danger);background:none}
.empty{padding:44px 20px;text-align:center;color:var(--mute)}

button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;margin-right:6px}
td.avg{padding:0 14px;font-weight:600;white-space:nowrap;background:var(--hover);min-width:96px}
tfoot td{border-top:1px solid var(--line);background:var(--hover);padding:11px 14px;font-weight:600}
tfoot td.avg{padding:11px 14px}
tfoot td.lbl{color:var(--mute);text-align:right}
th.avgh{background:var(--hover)}
.wrow th{padding:5px 8px;background:var(--card);border-bottom:1px solid var(--line)}
th.wl{text-align:right;font-weight:500}
th.wt{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
th.wt.warn{color:var(--danger)}
input.w{padding:6px 8px;text-align:center;min-width:64px;font-size:13px}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(480px,92vw);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px;font-size:18px}
dialog p{margin:0 0 14px;color:var(--mute);font-size:14px}
dialog textarea{min-height:170px;resize:vertical}
dialog .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<dialog id="dlg">
  <h3>Impor banyak nama</h3>
  <p>Satu baris satu mahasiswa. Format “Nama” atau “Nama, NIM” (dipisah koma atau tab, jadi bisa langsung paste dari Excel).</p>
  <textarea id="bulk" placeholder="Budi Santoso, 2201001&#10;Siti Aminah, 2201002"></textarea>
  <div class="act"><button id="bc">Batal</button><button class="primary" id="bo">Tambahkan</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
